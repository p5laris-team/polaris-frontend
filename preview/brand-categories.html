<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--bg-1); padding: 28px; color: var(--fg-1); display: flex; gap: 16px; align-items: center; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .item img { width: 80px; height: 80px; display: block; }
  .name { font-family: var(--font-display); font-weight: 700; font-size: 13px; color: var(--fg-1); }
  .sub { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
</style></head>
<body>
  <div class="item"><img src="../assets/cat-morning.svg"><div class="name">아침</div><div class="sub">morning</div></div>
  <div class="item"><img src="../assets/cat-fitness.svg"><div class="name">운동</div><div class="sub">fitness</div></div>
  <div class="item"><img src="../assets/cat-reading.svg"><div class="name">독서</div><div class="sub">reading</div></div>
  <div class="item"><img src="../assets/cat-mind.svg"><div class="name">마음</div><div class="sub">mind</div></div>
</body></html>

<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--bg-1); padding: 28px; color: var(--fg-1); }
  .row { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .row:last-child { margin-bottom: 0; }
  .label { font-family: var(--font-mono); color: var(--fg-3); font-size: 11px; min-width: 90px; }
  .btn { font-family: var(--font-display); font-weight: 700; font-size: 16px; padding: 14px 22px; border-radius: 16px; border: 0; cursor: pointer; transition: all 0.14s var(--ease-out); display: inline-flex; align-items: center; gap: 8px; }
  .btn-primary { background: var(--primary); color: var(--fg-on-primary); }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-secondary { background: var(--bg-3); color: var(--fg-1); }
  .btn-ghost { background: transparent; color: var(--primary); }
  .btn-ghost:hover { background: var(--primary-soft); }
  .btn-disabled { background: var(--bg-4); color: var(--fg-4); cursor: not-allowed; }
  .btn-press { background: var(--primary-press); color: white; transform: scale(0.96); }
  .btn-large { font-size: 17px; padding: 18px 28px; }
  .btn-small { font-size: 14px; padding: 8px 14px; }
</style></head>
<body>
  <div class="row">
    <span class="label">primary</span>
    <button class="btn btn-primary">시작하기</button>
    <button class="btn btn-primary btn-large">미션 시작하기</button>
    <button class="btn btn-primary btn-small">확인</button>
  </div>
  <div class="row">
    <span class="label">secondary</span>
    <button class="btn btn-secondary">다음에</button>
    <button class="btn btn-ghost">건너뛰기</button>
    <button class="btn btn-disabled">완료 (비활성)</button>
  </div>
  <div class="row">
    <span class="label">states</span>
    <button class="btn btn-primary" style="background: var(--primary-hover)">호버</button>
    <button class="btn btn-press">눌림</button>
    <button class="btn btn-primary" style="box-shadow: var(--glow-primary)">포커스</button>
  </div>
</body></html>

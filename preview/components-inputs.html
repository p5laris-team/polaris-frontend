<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--bg-1); padding: 28px; color: var(--fg-1); }
  .row { display: flex; gap: 14px; align-items: stretch; flex-wrap: wrap; }
  .input-group { display: flex; flex-direction: column; gap: 8px; width: 220px; }
  .label { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); font-weight: 600; }
  .input { background: var(--bg-2); border: 1.5px solid var(--border-2); border-radius: 14px; padding: 14px 16px; font-size: 16px; color: var(--fg-1); font-family: inherit; transition: all 0.14s var(--ease-out); }
  .input:focus { outline: none; border-color: var(--primary); box-shadow: var(--glow-primary); }
  .input-focused { border-color: var(--primary); box-shadow: var(--glow-primary); }
  .input-error { border-color: var(--danger); }
  .input-disabled { background: var(--bg-3); color: var(--fg-4); cursor: not-allowed; }
  .hint { font-size: 12px; color: var(--fg-3); }
  .hint-error { color: var(--danger); }
</style></head>
<body>
  <div class="row">
    <div class="input-group">
      <span class="label">기본 / placeholder</span>
      <input class="input" placeholder="이메일을 입력해주세요" />
    </div>
    <div class="input-group">
      <span class="label">입력됨</span>
      <input class="input" value="hello@polaris.kr" readonly />
    </div>
    <div class="input-group">
      <span class="label">포커스</span>
      <input class="input input-focused" value="hello@polaris.kr" readonly />
      <span class="hint">잘 입력하셨어요</span>
    </div>
    <div class="input-group">
      <span class="label">에러</span>
      <input class="input input-error" value="hello.polaris" readonly />
      <span class="hint hint-error">이메일 형식이 맞지 않아요</span>
    </div>
  </div>
</body></html>

<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--bg-1); padding: 28px; color: var(--fg-1); display: flex; gap: 16px; align-items: center; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .item .frame { width: 80px; height: 80px; border-radius: 18px; box-shadow: var(--shadow-sm); overflow: hidden; }
  .item .frame img { width: 100%; height: 100%; }
  .name { font-family: var(--font-display); font-weight: 700; font-size: 13px; color: var(--fg-1); }
  .price { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-mono); font-size: 11px; color: var(--accent); font-weight: 700; }
  .price::before { content: '✦'; }
</style></head>
<body>
  <div class="item"><div class="frame"><img src="../assets/items/consumables/item-star-candy-meal.png"></div><div class="name">별사탕밥</div><div class="price">30</div></div>
  <div class="item"><div class="frame"><img src="../assets/items/consumables/item-cloud-pillow.png"></div><div class="name">구름 베개</div><div class="price">30</div></div>
  <div class="item"><div class="frame"><img src="../assets/items/consumables/item-star-toy.png"></div><div class="name">별 장난감</div><div class="price">30</div></div>
  <div class="item"><div class="frame"><img src="../assets/currency/star-piece-icon.png"></div><div class="name">별조각</div><div class="price">보상</div></div>
</body></html>

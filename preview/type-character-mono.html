<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--bg-1); padding: 28px; color: var(--fg-1); }
  .stack { display: flex; flex-direction: column; gap: 18px; }
  .label { font-family: var(--font-mono); color: var(--fg-3); font-size: 11px; margin-bottom: 6px; }
  .gaegu { font-family: "Gaegu", "Pretendard Variable", sans-serif; font-size: 28px; font-weight: 700; color: var(--fg-1); line-height: 1.3; }
  .bubble { display: inline-block; background: #FFFFFF; border: 1px solid var(--border-1); border-radius: 22px 22px 22px 6px; padding: 14px 18px; box-shadow: var(--shadow-sm); max-width: 340px; }
  .mono { font-family: var(--font-mono); font-size: 22px; font-weight: 500; color: var(--fg-1); letter-spacing: -0.02em; }
</style></head>
<body>
  <div class="stack">
    <div>
      <div class="label">Gaegu — 캐릭터 발화 / 감성 한정</div>
      <div class="bubble"><span class="gaegu">오늘은 같이 산책할까요?</span></div>
    </div>
    <div>
      <div class="label">JetBrains Mono — 통계 / 수치 정렬</div>
      <div class="mono">07 일 · 14 / 21 미션 · +680 별가루</div>
    </div>
  </div>
</body></html>

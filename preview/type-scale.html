<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--bg-1); padding: 28px 32px; color: var(--fg-1); }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; align-items: baseline; gap: 16px; }
  .meta { font-family: var(--font-mono); color: var(--fg-3); font-size: 11px; min-width: 130px; }
</style></head>
<body>
  <div class="stack">
    <div class="row"><span class="meta">Display · 44 / 800</span><span class="text-display">함께해요</span></div>
    <div class="row"><span class="meta">H1 · 28 / 800 SUIT</span><span class="text-h1">오늘의 미션</span></div>
    <div class="row"><span class="meta">H2 · 22 / 700 SUIT</span><span class="text-h2">별이가 기다리고 있어요</span></div>
    <div class="row"><span class="meta">H3 · 18 / 700</span><span class="text-h3">아침 루틴</span></div>
    <div class="row"><span class="meta">Lead · 18 / 400</span><span class="text-lead">하루를 천천히 시작해볼까요?</span></div>
    <div class="row"><span class="meta">Body · 17 / 400</span><span class="text-body">오늘은 어제보다 한 걸음 더 가까이 가는 날이에요.</span></div>
    <div class="row"><span class="meta">Small · 14 / 400</span><span class="text-small">목표 달성률은 매주 일요일에 정리해 드려요.</span></div>
    <div class="row"><span class="meta">Caption · 12 / 400</span><span class="text-caption">2025.05.20 화요일 오전 9:24</span></div>
  </div>
</body></html>

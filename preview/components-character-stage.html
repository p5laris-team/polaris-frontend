<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--bg-1); padding: 28px; color: var(--fg-1); display: flex; gap: 18px; align-items: center; }
  .stage { width: 280px; background: linear-gradient(180deg, #FCEBA8 0%, #F7EAD3 100%); border-radius: 24px; padding: 22px 20px; box-shadow: var(--shadow-character); display: flex; flex-direction: column; align-items: center; gap: 8px; position: relative; overflow: hidden; }
  .stage::before { content: ''; position: absolute; inset: 0; background: url('../assets/pattern-stardust.svg'); opacity: 0.55; pointer-events: none; }
  .char { width: 130px; height: 130px; position: relative; z-index: 1; }
  .name { font-family: var(--font-display); font-weight: 800; font-size: 18px; color: var(--neutral-800); z-index:1; }
  .bubble { background: white; border: 1px solid var(--border-1); border-radius: 18px 18px 18px 4px; padding: 10px 14px; font-family: "Gaegu", sans-serif; font-size: 17px; font-weight: 700; color: var(--fg-1); z-index: 1; box-shadow: var(--shadow-sm); }
  .stats { display: flex; gap: 8px; z-index: 1; margin-top: 4px; }
  .stat { background: rgba(255,255,255,.7); border-radius: 999px; padding: 4px 10px; font-size: 11px; font-weight: 700; color: var(--neutral-700); font-family: var(--font-mono); }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
</style></head>
<body>
  <div class="stage">
    <div class="char"><img src="../assets/characters/nova/core/character-nova-idle.png" style="width:100%;height:100%"></div>
    <div class="name">노바 · Lv.3</div>
    <div class="bubble">오늘은 같이 산책할까요?</div>
    <div class="stats">
      <span class="stat">♡ 78%</span>
      <span class="stat">✦ 240</span>
      <span class="stat">7일 연속</span>
    </div>
  </div>
  <div>
    <div class="meta" style="margin-bottom:6px">CharacterStage</div>
    <p style="font-size:13px;color:var(--fg-2);max-width:260px;line-height:1.6">홈 상단 히어로 카드. 캐릭터 표정·말풍선·상태가 모두 변화. 그라디언트 배경 + 별가루 패턴 오버레이.</p>
  </div>
</body></html>

<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--bg-1); padding: 28px; color: var(--fg-1); }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: center; gap: 16px; }
  .meta { font-family: var(--font-mono); color: var(--fg-3); font-size: 11px; min-width: 90px; }
  .bar { background: var(--clay-100); height: 18px; border-radius: 4px; }
  .name { font-family: var(--font-mono); color: var(--fg-2); font-size: 11px; min-width: 80px; }
</style></head>
<body>
  <div class="stack">
    <div class="row"><span class="meta">space-1</span><div class="bar" style="width:4px"></div><span class="name">4 px</span></div>
    <div class="row"><span class="meta">space-2</span><div class="bar" style="width:8px"></div><span class="name">8 px</span></div>
    <div class="row"><span class="meta">space-3</span><div class="bar" style="width:12px"></div><span class="name">12 px</span></div>
    <div class="row"><span class="meta">space-4</span><div class="bar" style="width:16px"></div><span class="name">16 px</span></div>
    <div class="row"><span class="meta">space-5</span><div class="bar" style="width:20px"></div><span class="name">20 px</span></div>
    <div class="row"><span class="meta">space-6</span><div class="bar" style="width:24px"></div><span class="name">24 px · 가장자리</span></div>
    <div class="row"><span class="meta">space-8</span><div class="bar" style="width:32px"></div><span class="name">32 px · 섹션</span></div>
    <div class="row"><span class="meta">space-10</span><div class="bar" style="width:40px"></div><span class="name">40 px</span></div>
    <div class="row"><span class="meta">space-12</span><div class="bar" style="width:48px"></div><span class="name">48 px</span></div>
    <div class="row"><span class="meta">space-16</span><div class="bar" style="width:64px"></div><span class="name">64 px</span></div>
    <div class="row"><span class="meta">space-20</span><div class="bar" style="width:80px"></div><span class="name">80 px · 히어로</span></div>
  </div>
</body></html>

<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--bg-1); padding: 28px; color: var(--fg-1); display:flex; gap:24px; }
  .toast { background: var(--bg-2); border: 1px solid var(--border-1); border-radius: 16px; padding: 14px 18px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow-md); min-width: 280px; }
  .toast .icon { width: 36px; height: 36px; border-radius: 999px; display: grid; place-items: center; flex-shrink: 0; font-weight: 800; color: white; }
  .toast .text { font-size: 15px; font-weight: 600; color: var(--fg-1); }
  .toast .sub { font-size: 12px; color: var(--fg-3); margin-top: 2px; }
  .toast-success .icon { background: var(--success); }
  .toast-info .icon { background: var(--primary); }
  .toast-danger .icon { background: var(--danger); }
  .col { display:flex; flex-direction:column; gap:14px; }
</style></head>
<body>
  <div class="col">
    <div class="toast toast-success">
      <div class="icon">✓</div>
      <div><div class="text">미션 완료!</div><div class="sub">별이가 두 칸 자랐어요</div></div>
    </div>
    <div class="toast toast-info">
      <div class="icon">✦</div>
      <div><div class="text">별가루 +20 획득</div><div class="sub">상점에서 사용해보세요</div></div>
    </div>
    <div class="toast toast-danger">
      <div class="icon">!</div>
      <div><div class="text">연결이 잠시 흐려졌어요</div><div class="sub">잠시 후 다시 시도해주세요</div></div>
    </div>
  </div>
</body></html>

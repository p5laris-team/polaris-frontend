<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--bg-1); padding: 28px; color: var(--fg-1); }
  .wrap { background: var(--bg-2); border: 1px solid var(--border-1); border-radius: 24px; padding: 24px 28px; }
  .row { display: flex; gap: 18px; align-items: baseline; padding: 10px 0; border-bottom: 1px dashed var(--border-1); }
  .row:last-child { border-bottom: 0; }
  .meta { font-family: var(--font-mono); color: var(--fg-3); font-size: 11px; min-width: 80px; }
  .w { font-family: "Pretendard Variable", sans-serif; font-size: 22px; color: var(--fg-1); letter-spacing: -0.01em; }
</style></head>
<body>
  <div class="wrap">
    <div class="row"><span class="meta">400 Regular</span><span class="w" style="font-weight:400">별이와 함께하는 하루</span></div>
    <div class="row"><span class="meta">500 Medium</span><span class="w" style="font-weight:500">별이와 함께하는 하루</span></div>
    <div class="row"><span class="meta">600 Semibold</span><span class="w" style="font-weight:600">별이와 함께하는 하루</span></div>
    <div class="row"><span class="meta">700 Bold</span><span class="w" style="font-weight:700">별이와 함께하는 하루</span></div>
    <div class="row"><span class="meta">800 Extrabold</span><span class="w" style="font-weight:800">별이와 함께하는 하루</span></div>
  </div>
</body></html>

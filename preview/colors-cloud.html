<!DOCTYPE html>
<html lang="ko" data-theme="cloud">
<head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--bg-1); padding: 24px; }
  .row { display: flex; gap: 14px; align-items: flex-end; }
  .swatch { width: 80px; height: 80px; border-radius: 20px; box-shadow: 0 1px 0 rgba(45,36,24,0.08); position: relative; overflow: hidden; }
  .swatch .label { position: absolute; left: 10px; bottom: 8px; font-size: 11px; font-weight: 700; color: rgba(255,255,255,.95); font-family: var(--font-mono); }
  .swatch.lt .label, .swatch.cream .label { color: var(--fg-1); }
  .meta { margin-top: 10px; font-size: 12px; color: var(--fg-2); font-family: var(--font-mono); }
  .name { font-family: var(--font-display); font-size: 13px; font-weight: 700; color: var(--fg-1); margin-top: 4px; }
</style></head>
<body>
  <div class="row">
    <div>
      <div class="swatch" style="background:#F2F5FB;border:1px solid var(--border-1)"><span class="label" style="color:#1F2A40">#F2F5FB</span></div>
      <div class="name">Bg Sky</div>
      <div class="meta">--bg-1</div>
    </div>
    <div>
      <div class="swatch cream" style="background:#FFFFFF;border:1px solid var(--border-1)"><span class="label">#FFFFFF</span></div>
      <div class="name">Card</div>
      <div class="meta">--bg-2</div>
    </div>
    <div>
      <div class="swatch" style="background:#1F2A40"><span class="label">#1F2A40</span></div>
      <div class="name">Ink</div>
      <div class="meta">--fg-1</div>
    </div>
    <div>
      <div class="swatch" style="background:#6F90DA"><span class="label">#6F90DA</span></div>
      <div class="name">Sky Blue</div>
      <div class="meta">--primary</div>
    </div>
    <div>
      <div class="swatch lt" style="background:#F7B5A8"><span class="label">#F7B5A8</span></div>
      <div class="name">Peach</div>
      <div class="meta">--accent</div>
    </div>
    <div>
      <div class="swatch" style="background:#5878C5"><span class="label">#5878C5</span></div>
      <div class="name">Sky Deep</div>
      <div class="meta">primary-hover</div>
    </div>
    <div>
      <div class="swatch" style="background:#2A4378"><span class="label">#2A4378</span></div>
      <div class="name">Midnight</div>
      <div class="meta">primary-strong</div>
    </div>
  </div>
</body></html>

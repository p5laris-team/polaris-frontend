<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--bg-1); padding: 28px; color: var(--fg-1); display: flex; gap: 18px; align-items: flex-start; }
  .header { width: 320px; background: var(--bg-2); border-radius: 20px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow-sm); border: 1px solid var(--border-1); }
  .iconbtn { width: 40px; height: 40px; border-radius: 14px; background: var(--bg-3); display: grid; place-items: center; flex-shrink: 0; cursor: pointer; transition: background 0.14s; }
  .iconbtn:hover { background: var(--bg-4); }
  .iconbtn svg { width: 20px; height: 20px; stroke: var(--fg-1); stroke-width: 1.75; fill: none; }
  .title { font-family: var(--font-display); font-weight: 800; font-size: 18px; color: var(--fg-1); flex: 1; text-align: center; }
  .sub { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); width: 320px; text-align: center; margin-top: 4px; }
  .col { display: flex; flex-direction: column; align-items: center; }
  .fab { width: 56px; height: 56px; border-radius: 999px; background: var(--primary); color: white; display: grid; place-items: center; box-shadow: var(--shadow-md); cursor: pointer; transition: transform 0.14s; }
  .fab:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  .fab svg { width: 26px; height: 26px; stroke: currentColor; stroke-width: 2.2; fill: none; }
</style></head>
<body>
  <div class="col">
    <div class="header">
      <div class="iconbtn"><svg viewBox="0 0 24 24"><path d="M15 6 L9 12 L15 18" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="title">미션 보러가기</div>
      <div class="iconbtn"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="19" r="1.5" fill="currentColor"/></svg></div>
    </div>
    <div class="sub">AppHeader · 56 px tall</div>
  </div>
  <div class="col" style="gap:8px;align-self:flex-end;margin-bottom:18px">
    <div class="fab"><svg viewBox="0 0 24 24"><path d="M12 5 L12 19 M5 12 L19 12" stroke-linecap="round"/></svg></div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3)">FAB · primary action</div>
  </div>
</body></html>

<!DOCTYPE html>
<html lang="ko" data-theme="latte" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Polaris — Mobile UI Kit (Android)</title>
  <link rel="stylesheet" href="../../colors_and_type.css">
  <link rel="stylesheet" href="../web/styles.css">
  <link rel="icon" type="image/svg+xml" href="../../assets/logomark.svg">
  <style>
    body { margin: 0; min-height: 100vh; background: #ECE6D8; transition: background 0.22s; }
    [data-mode="dark"] body { background: #1A150D; }
    /* Mobile kit: app shell should fill android device area, not become a card */
    .frame-bg { padding: 0; background: transparent !important; min-height: 0; }
    .app-shell {
      width: 100% !important;
      min-height: 100% !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      border: 0 !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Tweaks shell (re-use web's) -->
  <script type="text/babel" src="../web/tweaks-panel.jsx"></script>
  <!-- Android device frame -->
  <script type="text/babel" src="android-frame.jsx"></script>
  <!-- Reuse web kit components/screens -->
  <script type="text/babel" src="../web/icons.jsx"></script>
  <script type="text/babel" src="../web/components.jsx"></script>
  <script type="text/babel" src="../web/screens-auth.jsx"></script>
  <script type="text/babel" src="../web/screens-app.jsx"></script>
  <!-- Mobile entrypoint -->
  <script type="text/babel" src="mobile-app.jsx"></script>
</body>
</html>
